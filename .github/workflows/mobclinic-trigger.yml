name: Trigger Docker Build

on:
  push:
    branches:
      - develop

jobs:
  trigger-frappe-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger frappe_docker build
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.DOCKER_REPO_PAT }}" \
            https://api.github.com/repos/ananthcjayan12/frappe_docker/actions/workflows/docker-image.yml/dispatches \
            -d '{
              "ref": "BR-MOBCLINIC-BACKEND"
            }'
          echo "✅ Triggered frappe_docker build for BR-MOBCLINIC-BACKEND"